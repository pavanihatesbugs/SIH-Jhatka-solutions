services:

  db:
    image: postgres:16
    container_name: aadhaar_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aadhaar_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aadhaar_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build: 
      context: .
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aadhaar_db

    ports:
      - "8000:8000"


volumes:
  postgres_data: